# 工蜂 Stream CI 配置 —— KuiklyUI 发布器自动化测试
#
# 入口：工蜂仓库「配置 CI YAML」→ 仓库根 .ci.yml（由 Stream CI 引擎执行）
# 说明：
#   本仓库的自动化测试为 Android 真机 E2E（Appium + 仓库内置 e2e-engine），
#   必须在「连着 Android 真机的 Mac」上执行。因此 job 通过 tags 约束到
#   注册在本机 Mac 的私有 Runner/执行机（tag: mac-local-device）。
#
# 触发方式：
#   - 每天定时（schedule）：跑 e2e_publisher
#   - 提 MR / push：跑 build 编译校验；e2e 默认手动触发（避免每次 push 占真机）
#
# 前置（本机 Mac 一次性配置）：
#   1. 在 Stream CI / 工蜂 Runner 管理注册执行机，tags 填 mac-local-device
#   2. 真机 vivo 保持 USB 连接并开启 USB 调试
#   3. Android SDK / workbuddy node(appium) 路径见 ci/setup-env.sh

stages:
  - build
  - test

.defaults: &defaults
  tags:
    - mac-local-device
  before_script:
    - source ci/setup-env.sh

# ---------- 编译校验（验证代码不坏） ----------
build_debug:
  <<: *defaults
  stage: build
  script:
    - ./gradlew :androidApp:compileDebugKotlin
  only:
    - schedules
    - merge_requests
    - pushes

# ---------- 真机 E2E 回归（每天定时自动跑） ----------
e2e_publisher:
  <<: *defaults
  stage: test
  script:
    - bash ci/run-e2e-ci.sh
  artifacts:
    when: always
    paths:
      - /tmp/appium_publisher.log
      - /tmp/e2e_engine_publisher.log
    expire_in: 3 days
  only:
    - schedules
    - merge_requests
  # push 时改为手动触发，避免每次提交都占用真机
  except:
    - pushes
  allow_failure: false
