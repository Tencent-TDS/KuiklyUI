# 智研 Coding 流水线配置 —— KuiklyUI 发布器自动化测试
#
# 说明：
#   本仓库的自动化测试为 Android 真机 E2E（Appium + 仓库内置 e2e-engine），
#   必须在「连着 Android 真机的 Mac 私有执行机」上执行。
#   流水线运行环境 = 注册到智研项目的 Mac 私有执行机（需先按 iWiki 4010346814 接入）。
#
# 配置来源：代码库读取 YAML（交付流 → 新建流水线 → 代码库读取 YAML → 本文件）
# 触发方式：在智研流水线「触发规则」里配定时触发（如 0 2 * * * 每天凌晨2点），
#           push / MR 触发也在触发规则里开启。
# 执行环境：流水线执行机请指定本 Mac 私有执行机（不要选公共构建机，公共机构无 Android 真机）。

pipeline:
  stages:
    # ---------- 编译校验（验证代码不坏） ----------
    - build:
        name: "编译校验"
        commands:
          - source ci/setup-env.sh
          - ./gradlew :androidApp:compileDebugKotlin

    # ---------- 真机 E2E 回归（每天定时自动跑） ----------
    - e2e:
        name: "发布器真机 E2E 回归"
        commands:
          - bash ci/run-e2e-ci.sh
