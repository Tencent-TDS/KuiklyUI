name: 发布器 E2E 回归

# 触发：PR 到 main（门禁）、push 到 main（仅当改动涉及测试相关路径时跑，避免每次提交都占用模拟器）
on:
  push:
    branches: [ main, 'feat/**' ]
    paths:
      - 'demo/**'
      - 'core/**'
      - 'compose/**'
      - 'androidApp/**'
      - 'ci/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'demo/**'
      - 'core/**'
      - 'compose/**'
      - 'androidApp/**'
      - 'ci/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  # ---- 路径一：模拟器冒烟（先上，零硬件、AI 全可见）----
  e2e-emulator:
    name: 发布器 E2E（模拟器冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Gradle / Kotlin-Native 缓存：KMP 冷构建在干净 runner 上极易吃满 45min，
      # 缓存后二次构建与排障重跑显著提速（首次运行 cache 为空，仅 timeout 兜底）。
      - name: Restore Gradle & Kotlin-Native cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 真根因（run #1–#7 全部命中）：ubuntu-latest(24.04) 上 /dev/kvm 的 udev 规则默认不给
      # runner 用户权限（日志铁证：`ProbeKVM: This user doesn't have permissions to use KVM`
      # + `The KVM line in /etc/group is: [kvm:x:993:]` —— 组存在但没成员），于是
      # emulator-runner 走 `Disabling Linux hardware acceleration` 用纯软件模拟(TCG)。
      # 软件模拟下整机慢约 10 倍：boot 374s、`adb shell getprop` 3s、`dumpsys package` 10s、
      # `ps -A` 9s、装 apk 40-65s，于是每轮都在不同位置撞超时（install 抖动 / session>120s /
      # hidden_api_policy 20s / window_animation_scale Broken pipe / uia2 instrumentation 60s）
      # —— 都是同一根因的影子。开 KVM 让模拟器走硬件加速，这些超时不再被触发（而非被放宽）。
      - name: 开启 KVM 硬件加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: 起 Android 模拟器并跑 E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          # 不指定 profile 时默认 AVD 是 qemu.skin=320x640（极小屏）。发布器页外层 Column 不可滚动，
          # 按 dp 排下来 top padding 32 + 标题 + 输入框 min 120dp + Spacer + 6 个调试 Text 超出 640px，
          # debug_delete_state / debug_inject_张（调试区最后两个节点）被挤出屏幕、不进 accessibility 树，
          # 导致 TC4/TC7/TC8 失败（run #9: PASS=7 FAIL=3）。vivo 真机屏幕大故工蜂 PASS=10——
          # 是模拟器屏幕尺寸的环境差异，不是业务回归。用 pixel_5（1080x2340）给足垂直空间。
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # disable-animations:false 是为了避开 reactivecircus 动作自己跑的
          # `adb shell settings put global window_animation_scale 0.0` 在冷模拟器上 Broken pipe / exit 224
          # （与 hidden_api_policy 同款 adb shell settings 抖动），那一步崩了会跳过整个 script。
          # uia2 看 view tree 不依赖动画关/开。
          disable-animations: false
          script: |
            bash ci/run-e2e-linux.sh --install
        env:
          MOBILE_TEST_PORT: 7900
          # 冷模拟器首跑 uia2 install + 启动要 >120s（WebDriverIO connectionRetryTimeout 默认 120s 会卡死超时）；
          # vivo 真机 2min 内足够（device job 保持默认），这里只放宽 emulator 路径。
          WEBDRIVER_REQUEST_TIMEOUT_MS: "300000"
          SESSION_TIMEOUT_S: "300"
          # 无 KVM 权限的 ubuntu runner 上模拟器是纯软件模拟（TCG），uia2 instrumentation 启动
          # 极慢，默认 uiautomator2ServerLaunchTimeout=60s 不够（CI 实证：am instrument 空输出、
          # 60s 超时、start-session 3 次全败）。放宽到 180s；真机默认 60s 不动。
          ANDROID_UIA2_SERVER_LAUNCH_TIMEOUT_MS: "180000"
          # start-session 自愈重试次数：引擎层主动「等 uia2 就绪」——每次 instrumentation 冷启
          # 动失败就清半死态让 Appium 重拉，吸收首次冷启动失败使「首开」真正零失败。冷模拟器
          # 放宽到 5；真机默认 3 足够。
          ANDROID_UIA2_START_MAX_ATTEMPTS: "5"

  # ---- 路径二：vivo 真机（后续启用）----
  # 启用步骤：
  #   1) 本机 Mac 注册 GitHub self-hosted runner（标签 macos + 自定 label）
  #   2) USB 接 vivo 并授权；把 serial 存入仓库 secret DEVICE_SERIAL
  #   3) 去掉下面 `if: false`
  # 说明：日志经 step stdout 进云端 job log，AI 用 gh 直读，不需读本机 /tmp。
  e2e-device:
    name: 发布器 E2E（vivo 真机 · self-hosted）
    runs-on: [self-hosted, macos]
    timeout-minutes: 60
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 跑 E2E（真机）
        run: bash ci/run-e2e-linux.sh --install
        env:
          MOBILE_TEST_PORT: 7900
          DEVICE_SERIAL: ${{ secrets.DEVICE_SERIAL }}
