name: 发布器 E2E 回归

# 触发策略：
#   - push/PR：跑 JVM 单测 + **直接跑 vivo 真机 E2E**（门禁）。真机保真度最高，
#     与工蜂真机线一致。模拟器冒烟已移除（真机测到的输入法/厂商 ROM/性能模拟器测不到，
#     且模拟器小屏等环境差异会引入与真机不一致的假红，维护两套成本高）。
#   - 真机是独占资源（一台 vivo + 一台 Mac runner），故加 concurrency：连续 push 时
#     旧 run 自动取消、只跑最新一次，避免排队积压抢真机。
#   - 真机 job 与工蜂 .ci/pipeline.yml 的 e2e_publisher 共用同一台 vivo + 同一台 Mac。
#     设备上 uia2 instrumentation 是单例，两条 CI 同时跑会互相杀。定时已错峰：
#     工蜂 10:00、GitHub 10:50（均 UTC+8），间隔 50min > 单轮实测 12m58s。
#     注意时区不同：工蜂 cron 是北京时间，GitHub cron 是 UTC。改前先换算。
#   - paths 过滤：仅测试相关路径改动才触发，纯文档改动不烧 CI。
on:
  push:
    branches: [ main, 'feat/**' ]
    paths:
      - 'demo/**'
      - 'core/**'
      - 'compose/**'
      - 'androidApp/**'
      - 'ci/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'demo/**'
      - 'core/**'
      - 'compose/**'
      - 'androidApp/**'
      - 'ci/**'
      - '.github/workflows/e2e.yml'
  # 每日真机回归：10:50 (UTC+8) = 02:50 UTC。选工作时段而非凌晨——
  # runner 跑在本机 Mac 上，凌晨休眠/关机会让任务静默不跑。
  schedule:
    - cron: '50 2 * * 1-5'
  # 手动触发：需要临时验真机时用。
  workflow_dispatch:
    inputs:
      run_device:
        description: '跑 vivo 真机 E2E'
        type: boolean
        default: true

# 真机独占资源防排队：同一分支（ref）连续 push 时，旧 run 自动取消、只跑最新。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- 路径零：JVM 单测（零设备快速门禁）----
  # 对齐工蜂 .ci/pipeline.yml 的 build_debug（`:demo:testDebugUnitTest`，12 例原生单测）。
  # 价值：纯逻辑回归几十秒内就能拦住，不必等 4-13min 的 E2E；
  # 且单测的失败信号比 E2E 精确得多（直接指到断言，而非"某个 TC 红了"）。
  # 此前 GitHub 侧缺这一层，任何逻辑退化都得靠 E2E 兜底才发现。
  unit-test:
    name: JVM 单测（发布器逻辑）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-unit-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-unit-${{ runner.os }}-

      - name: 跑 JVM 单测
        run: ./gradlew :demo:testDebugUnitTest --console=plain

      - name: 上传单测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: demo/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

  # ---- 路径一：vivo 真机（self-hosted）----
  # runner：本机 Mac 注册，见 ci/setup-selfhosted-runner.sh。
  # **真机门禁**：push/PR 到 main（测试相关路径）直接跑真机 E2E，与工蜂真机线一致。
  #   真机独占资源（一台 vivo + 一台 Mac runner），连续 push 会排队——顶层 concurrency
  #   已设 cancel-in-progress，旧 push 自动取消、只跑最新，避免积压抢真机。
  # 定时 + 手动触发保留（每日回归 + 临时验真机）。
  # 说明：日志经 step stdout 进云端 job log，AI 用 gh 直读，不需读本机 /tmp
  #      （这正是相对工蜂的核心优势，已验证，见 CI对比分析_工蜂vsGitHub.md 4.2）。
  e2e-device:
    name: 发布器 E2E（vivo 真机 · self-hosted）
    # push/PR（门禁）+ 定时 + 手动触发都跑。push/PR 由文件头 paths 过滤（仅测试相关路径）。
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_device)
    # 必须与 runner 实际 label 完全一致。runner 注册后自带 self-hosted/macOS/ARM64
    # 三个内置 label（大小写如实），自定义的小写 macos 会被内置 macOS 去重掉。
    # 为避免大小写匹配的不确定性，这里直接用 runner 实际持有的 label。
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 跑 E2E（真机）
        run: bash ci/run-e2e-linux.sh --install
        env:
          MOBILE_TEST_PORT: 7900
          DEVICE_SERIAL: ${{ secrets.DEVICE_SERIAL }}
          # CAPTURE_BASELINE=1：PASS 用例也存截图（默认只有 FAIL 才收证据），
          # 配合下面的 artifact 上传，让真机画面随 evidence 进云端（AI/人可见）。
          CAPTURE_BASELINE: "1"

      # 真机线的关键验证点：证据能否随 artifact 进云端。
      # 若这一步产出正常，说明 self-hosted 确实补上了工蜂"日志/证据 AI 不可见"的短板。
      - name: 上传 E2E 证据与截图（真机）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-device-evidence
          path: |
            demo/logs/**
            demo/golden-baseline/**
          if-no-files-found: warn
          retention-days: 14
